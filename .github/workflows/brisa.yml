name: Brisa Mail Otomasyon

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  calistir:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kütüphaneleri yükle
        run: pip install -r requirements.txt

      - name: Playwright tarayıcısını yükle
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Sistemi çalıştır
        env:
          GOOGLE_API_KEY:      ${{ secrets.GOOGLE_API_KEY }}
          GMAIL_TOKEN_JSON:    ${{ secrets.GMAIL_TOKEN_JSON }}
          SHEETS_ID:           ${{ secrets.SHEETS_ID }}
          BILDIRIM_ALICISI:    ${{ secrets.BILDIRIM_ALICISI }}
          GONDEREN_LISTESI:    ${{ secrets.GONDEREN_LISTESI }}
        run: python main.py
